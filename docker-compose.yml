services:

  web:
    build:
      context: ./app
    container_name: student_web
    restart: unless-stopped

    volumes:
      - ./app:/app

    expose:
      - "8000"

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend
      - backend


  mysql:
    image: mysql:8.0
    container_name: student_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: student_mysql_exporter
    restart: unless-stopped

    volumes:
      - ./monitoring/.my.cnf:/cfg/.my.cnf:ro

    command:
      - "--config.my-cnf=/cfg/.my.cnf"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: student_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend
      - backend


  nginx:
    image: nginx:alpine
    container_name: student_nginx
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - web

    networks:
      - frontend


  prometheus:
    image: prom/prometheus:latest
    container_name: student_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - frontend
      - backend


  grafana:
    image: grafana/grafana:latest
    container_name: student_grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - frontend


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: student_cadvisor
    restart: unless-stopped

    ports:
      - "8082:8080"

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - frontend


  loki:
    image: grafana/loki:3.7.0
    container_name: student_loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    command: -config.file=/etc/loki/loki-config.yml

    networks:
      - frontend


  promtail:
    image: grafana/promtail:3.5.0
    container_name: student_promtail
    restart: unless-stopped

    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command: -config.file=/etc/promtail/config.yml

    depends_on:
      - loki

    networks:
      - frontend


networks:
  frontend:
  backend:
    internal: true


volumes:
  mysql_data:
  grafana_data:
  loki_data: