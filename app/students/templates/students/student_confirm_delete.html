<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xóa sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .card h1 {
            color: #dc2626;
            margin-bottom: 15px;
        }

        .card p {
            color: #4b5563;
            line-height: 1.6;
        }

        .student-name {
            font-weight: bold;
            color: #111827;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Xóa sinh viên?</h1>

        <p>
            Bạn có chắc chắn muốn xóa sinh viên
            <span class="student-name">
                {{ student.full_name }}
            </span>
            ({{ student.student_code }})?
        </p>

        <p>
            Hành động này không thể hoàn tác.
        </p>


        <div class="actions">

            <a
                href="{% url 'student_list' %}"
                class="btn btn-cancel"
            >
                Hủy
            </a>


            <form method="POST" style="display: inline;">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-delete"
                >
                    Xác nhận xóa
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
