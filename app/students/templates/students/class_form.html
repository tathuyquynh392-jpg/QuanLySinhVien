<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>
        {% if class_obj %}
            Sửa lớp
        {% else %}
            Thêm lớp
        {% endif %}
    </title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f2747;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button,
        a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #e5e7eb;
            color: #374151;
            margin-left: 8px;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        {% if class_obj %}
            ✏️ Sửa lớp
        {% else %}
            ➕ Thêm lớp
        {% endif %}
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Lưu
        </button>

        <a href="{% url 'class_list' %}" class="back">
            Quay lại
        </a>

    </form>

</div>

</body>
</html>
